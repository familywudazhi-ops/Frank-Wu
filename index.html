<script>
(() => {
  'use strict';
  const LETTERS = ['A','B','C','D'];
  const NODE_NAMES = { n1:['匯率變動機制','Exchange Rate Mechanism'], n2:['央行外匯存底','Foreign Exchange Reserves'], n3:['GDP 與內需調控','GDP & Domestic Demand'] };
  const QUESTIONS = [
    {id:'q1',nodeId:'n1',level:'基礎 / Basic',cn:'日本進口能源增加，進口商需要大量美元。日圓最可能面臨什麼壓力？',en:'Japan imports more energy and needs more U.S. dollars. What happens to the yen?',options:[['貶值壓力','Increase in depreciation pressure'],['升值壓力','Increase in appreciation pressure'],['完全不變','No change at all'],['外匯存底立即增加','Reserves immediately increase']],correct:0,hints:['想想進口商要賣出哪一種貨幣。 / Which currency do importers sell?','大量賣出本幣會增加本幣供給。 / Selling the domestic currency increases its supply.'],explain:'進口商賣出日圓買入美元，日圓供給增加，因此產生貶值壓力。 / Importers sell yen to buy dollars, increasing yen supply and creating depreciation pressure.',art:'Japan energy imports currency exchange'},
    {id:'q2',nodeId:'n1',level:'基礎 / Basic',cn:'長期貿易順差通常會如何影響本幣需求？',en:'How can a long-term trade surplus affect demand for the domestic currency?',options:[['增加本幣需求','Increase demand for the domestic currency'],['一定使本幣貶值','It always causes depreciation'],['只會增加進口','It only increases imports'],['與外匯市場無關','It is unrelated to FX markets']],correct:0,hints:['出口商收到外幣後通常需要結匯。 / Exporters often exchange foreign currency.','結匯會產生哪一種貨幣的需求？ / Which currency is demanded during conversion?'],explain:'順差帶來外匯收入，可能增加市場對本幣的需求。 / A surplus brings foreign-currency income and may increase demand for the domestic currency.',art:'international trade currency exchange'},
    {id:'q3',nodeId:'n2',level:'基礎 / Basic',cn:'台灣出口商收到大量美元後，央行買入美元並釋出新台幣，會造成什麼結果？',en:'When Taiwan’s central bank buys dollars and releases New Taiwan dollars, what happens?',options:[['外匯存底下降','Reserves decrease'],['出口收入消失','Export revenue disappears'],['外匯存底增加','Reserves increase'],['GDP 公式改變','The GDP formula changes']],correct:2,hints:['央行買入的是哪一種資產？ / What asset does the central bank buy?','買入外幣會累積國家外匯資產。 / Buying foreign currency accumulates national FX assets.'],explain:'央行吸收出口外匯後，會增加外匯存底。 / When the central bank absorbs export FX, foreign exchange reserves increase.',art:'central bank foreign exchange reserves'},
    {id:'q4',nodeId:'n2',level:'進階 / Advanced',cn:'為什麼充足的外匯存底能提高金融體系的防禦力？',en:'Why can sufficient foreign exchange reserves strengthen financial stability?',options:[['可以消除所有經濟風險','They eliminate all economic risks'],['可以讓進口免費','They make imports free'],['會自動提高所有人的所得','They automatically raise everyone’s income'],['可提供外匯流動性','They provide foreign-currency liquidity']],correct:3,hints:['金融危機時，市場可能最需要哪一種資產？ / What asset may be needed during a crisis?','外匯存底可支援外匯支付與市場信心。 / Reserves support FX payments and confidence.'],explain:'外匯存底可在壓力情況下提供外匯流動性，但不能消除所有風險。 / Reserves provide FX liquidity under stress, but cannot eliminate every risk.',art:'financial stability central bank vault'},
    {id:'q5',nodeId:'n3',level:'進階 / Advanced',cn:'若消費與投資強勁，即使淨出口為負，GDP 是否仍可能成長？',en:'Can GDP still grow when net exports are negative but consumption and investment are strong?',options:[['可以','Yes'],['不可能','No'],['只有出口增加才可以','Only if exports increase'],['進口一定等於零','Imports must be zero']],correct:0,hints:['回想 GDP 四個組成部分。 / Recall the four GDP components.','消費與投資也是 GDP 的正向來源。 / Consumption and investment also contribute positively.'],explain:'GDP = C + I + G + (X-M)，強勁內需可抵銷負的淨出口。 / GDP = C + I + G + (X-M); strong domestic demand can offset negative net exports.',art:'GDP domestic consumption investment dashboard'},
    {id:'q6',nodeId:'n3',level:'進階 / Advanced',cn:'下列哪一項正確表示 GDP 公式？',en:'Which equation correctly represents GDP?',options:[['GDP = C + I + G + (X + M)','GDP = C + I + G + (X + M)'],['GDP = C + I + G + (X − M)','GDP = C + I + G + (X − M)'],['GDP = X − M','GDP = X − M'],['GDP = 消費 − 投資','GDP = Consumption − Investment']],correct:1,hints:['淨出口是出口減進口。 / Net exports are exports minus imports.','GDP 還包含消費、投資與政府支出。 / GDP also includes C, I and G.'],explain:'進口不是直接加總，而是從出口中扣除。 / Imports are not added directly; they are subtracted from exports.',art:'GDP equation economic classroom'},
    {id:'q7',nodeId:'n1',level:'綜合 / Integrated',cn:'某國出口增加、央行吸收外匯，最合理的連鎖結果是什麼？',en:'A country increases exports and its central bank absorbs foreign currency. What is the most reasonable chain?',options:[['外匯存底下降且本幣必然貶值','Reserves fall and the currency must depreciate'],['進口必然增加','Imports must increase'],['外匯存底增加，並可能增加本幣需求','Reserves rise and demand for the currency may increase'],['GDP 必然下降','GDP must fall']],correct:2,hints:['分別判斷出口對外匯與貨幣需求的影響。 / Consider FX and currency-demand effects separately.','出口帶來外幣收入，央行吸收後形成存底。 / Exports bring FX income; absorption builds reserves.'],explain:'出口順差可能帶來外匯存底累積與本幣需求增加。 / Export surpluses may build reserves and increase demand for the domestic currency.',art:'export growth central bank currency flow'},
    {id:'q8',nodeId:'n3',level:'Boss / Boss',cn:'美國出現長期貿易逆差，但民間消費與企業投資強勁。最合理的判斷是什麼？',en:'The United States has a long-term trade deficit, but consumption and investment remain strong. What is the best conclusion?',options:[['GDP 必然衰退','GDP must contract'],['逆差一定造成金融危機','A deficit always causes a financial crisis'],['進口不會影響 GDP','Imports do not affect GDP'],['內需可能支撐 GDP 成長','Domestic demand may support GDP growth']],correct:3,hints:['貿易差額只是 GDP 的其中一個部分。 / The trade balance is only one part of GDP.','觀察 C 與 I 是否能補足負的 X-M。 / Check whether C and I offset negative X-M.'],explain:'貿易逆差會拉低淨出口，但強勁消費與投資仍可能維持 GDP 成長。 / A deficit lowers net exports, but strong consumption and investment can still support growth.',art:'United States domestic demand GDP growth'}
  ];

  const root = document.getElementById('appRoot');

  function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function t(cn,en){return state.lang==='zh'?cn:en;}
  function levelText(level){const parts=String(level||'').split(' / ');return state.lang==='zh'?parts[0]:parts[parts.length-1];}
  function nodeText(id){const parts=NODE_NAMES[id]||['',''];return state.lang==='zh'?parts[0]:parts[1];}
  function toast(msg){toastRoot.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>toastRoot.innerHTML='',2600);}
  async function unlockAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;if(!state.audioContext)state.audioContext=new C();if(state.audioContext.state==='suspended')await state.audioContext.resume();state.soundUnlocked=state.audioContext.state==='running';return state.soundUnlocked}catch(_){return false}}
  function beep(kind='click'){if(state.muted)return;try{const ctx=state.audioContext;if(!ctx||ctx.state!=='running')return;const now=ctx.currentTime;const melody=[523,587,659,784,659,587,523,659,784,880,784,659,587,523,659];const melodyIndex=Math.max(0,Math.min(melody.length-1,20-(Number(state.timeLeft)||20)));const notes={click:[[440,.08,'sine']],correct:[[523,.1,'sine'],[659,.13,'sine']],wrong:[[170,.18,'sawtooth']],countdown:[[melody[melodyIndex],.18,'sine'],[melody[melodyIndex]*1.5,.1,'triangle']],tick:[[760,.05,'square']],win:[[523,.12,'sine'],[659,.12,'sine'],[784,.2,'sine']]}[kind]||[[440,.08,'sine']];const volume=kind==='countdown'?.06:.08;notes.forEach((note,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),at=now+i*.1;o.type=note[2];o.frequency.value=note[0];g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(volume,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+note[1]);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+note[1]+.02)})}catch(_) {}}
  async function testSound(){const ok=await unlockAudio();if(ok){beep('correct');toast(state.lang==='zh'?'音效測試成功':'Sound test passed')}else toast(state.lang==='zh'?'瀏覽器未允許音效，請點擊頁面後再試':'Audio is blocked; click the page and try again')}
  function fallbackSvg(label,color='#46d9ff'){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="'+color+'" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".15"/></linearGradient></defs><rect width="900" height="300" fill="url(#g)"/><path d="M0 240 C130 170 180 260 300 155 S530 110 650 175 S790 120 900 60" fill="none" stroke="'+color+'" stroke-width="8" opacity=".8"/><circle cx="650" cy="175" r="12" fill="#ffd166"/><text x="48" y="75" fill="#ecf5ff" font-family="Arial" font-size="34" font-weight="700">'+label.replace(/[<>&]/g,'')+'</text><text x="48" y="112" fill="#b8cbe0" font-family="Arial" font-size="18">Trade Balance Live</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
  function imageUrl(q){return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(q+', educational economics dashboard illustration, clean neon glassmorphism, no text')+'?width=900&height=300&nologo=true&seed=42'}
