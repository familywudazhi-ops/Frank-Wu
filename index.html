  const QUESTIONS = [
    {id:'q1',nodeId:'n1',level:'基礎 / Basic',cn:'日本進口能源增加，進口商需要大量美元。日圓最可能面臨什麼壓力？',en:'Japan imports more energy and needs more U.S. dollars. What happens to the yen?',options:[['貶值壓力','Increase in depreciation pressure'],['升值壓力','Increase in appreciation pressure'],['完全不變','No change at all'],['外匯存底立即增加','Reserves immediately increase']],correct:0,hints:['想想進口商要賣出哪一種貨幣。 / Which currency do importers sell?','大量賣出本幣會增加本幣供給。 / Selling the domestic currency increases its supply.'],explain:'進口商賣出日圓買入美元，日圓供給增加，因此產生貶值壓力。 / Importers sell yen to buy dollars, increasing yen supply and creating depreciation pressure.',art:'Japan energy imports currency exchange'},

    {id:'q3',nodeId:'n2',level:'基礎 / Basic',cn:'台灣出口商收到大量美元後，央行買入美元並釋出新台幣，會造成什麼結果？',en:'When Taiwan’s central bank buys dollars and releases New Taiwan dollars, what happens?',options:[['外匯存底下降','Reserves decrease'],['出口收入消失','Export revenue disappears'],['外匯存底增加','Reserves increase'],['GDP 公式改變','The GDP formula changes']],correct:2,hints:['央行買入的是哪一種資產？ / What asset does the central bank buy?','買入外幣會累積國家外匯資產。 / Buying foreign currency accumulates national FX assets.'],explain:'央行吸收出口外匯後，會增加外匯存底。 / When the central bank absorbs export FX, foreign exchange reserves increase.',art:'central bank foreign exchange reserves'},

    {id:'q6',nodeId:'n3',level:'進階 / Advanced',cn:'下列哪一項正確表示 GDP 公式？',en:'Which equation correctly represents GDP?',options:[['GDP = C + I + G + (X + M)','GDP = C + I + G + (X + M)'],['GDP = C + I + G + (X − M)','GDP = C + I + G + (X − M)'],['GDP = X − M','GDP = X − M'],['GDP = 消費 − 投資','GDP = Consumption − Investment']],correct:1,hints:['淨出口是出口減進口。 / Net exports are exports minus imports.','GDP 還包含消費、投資與政府支出。 / GDP also includes C, I and G.'],explain:'進口不是直接加總，而是從出口中扣除。 / Imports are not added directly; they are subtracted from exports.',art:'GDP equation economic classroom'},

  }
  function submitStudent(auto){if(state.playerAnswer===undefined)return;clearInterval(state.timer);const q=QUESTIONS[state.qIndex];const correct=state.playerAnswer===q.correct;const speed=Math.max(0,state.timeLeft)*15;const score=correct?1000+speed:0;state.attempts.push({questionId:q.id,answer:state.playerAnswer,correct,hint:0,time:20-state.timeLeft});state.scores[state.player?.id||'local']={name:state.player?.name||'學生',score:(state.scores[state.player?.id||'local']?.score||0)+score};beep(correct?'correct':'wrong');if(!state.offline)api('/api/session/'+state.session.code+'/answer',{method:'POST',body:JSON.stringify({playerId:state.player.id,questionId:q.id,answer:state.playerAnswer,responseTimeMs:(20-state.timeLeft)*1000})}).catch(()=>{});modal('<h3>'+ (correct?'✅ 答對了！':'📘 看看解析')+'</h3><p>'+esc(correct?q.explain:q.hints[0])+'</p><div class="notice" style="margin-top:12px">'+esc(q.explain)+'</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary" id="closeResult">'+(state.qIndex===QUESTIONS.length-1?'查看學習報告':'等待下一題')+'</button></div>');document.getElementById('closeResult').onclick=()=>{closeModal();if(state.qIndex===QUESTIONS.length-1){state.phase='report';renderStudent()}else{state.qIndex++;state.playerAnswer=undefined;state.phase='question';renderStudent();startTimer()}}}
  function showHint(q,level){const text=level===1?q.hints[0]:q.hints[1];modal('<h3>💡 '+(state.lang==='zh'?'概念提示':'Concept Hint')+'</h3><p>'+esc(text)+'</p><div class="notice">'+esc(state.lang==='zh'?'提示不會直接公布答案，請回到題目重新判斷。':'The hint does not reveal the answer. Reconsider the question.')+'</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary" id="hintClose">繼續作答</button></div>');document.getElementById('hintClose').onclick=closeModal}
  async function pollStudent(){if(state.screen!=='student'||state.offline||!state.session?.code||state.polling)return;state.polling=true;clearTimeout(state.pollTimer);try{const data=await api('/api/session/'+state.session.code);const serverLang=data.session?.language;if(serverLang&&serverLang!==state.lang){state.lang=serverLang;render()}if(data.session?.status==='playing'&&state.phase==='lobby'){state.phase='question';state.qIndex=data.session.questionIndex||0;renderStudent();applyLanguage();startTimer();state.polling=false;return}if(data.session?.status==='playing'&&state.phase==='question'&&Number.isInteger(data.session.questionIndex)&&data.session.questionIndex!==state.qIndex){state.qIndex=data.session.questionIndex;state.playerAnswer=undefined;renderStudent();applyLanguage();startTimer();state.polling=false;return}}catch(_){}state.polling=false;state.pollTimer=setTimeout(pollStudent,2500)}
  async function pollHostLobby(){if(state.screen!=='host'||state.phase!=='lobby'||state.offline||!state.session?.code)return;try{const data=await api('/api/session/'+state.session.code);state.session.players=data.players||[];const count=document.getElementById('playerCount');if(count)count.textContent=state.session.players.length;if(data.session?.status==='playing'){state.phase='question';state.qIndex=data.session.questionIndex||0;render();startTimer();return}}catch(_){}setTimeout(pollHostLobby,2500)}
  function renderReport(){const attempts=state.attempts;const total=attempts.length;const correct=attempts.filter(a=>a.correct).length;const byNode={n1:[],n2:[],n3:[]};attempts.forEach(a=>{const q=QUESTIONS.find(x=>x.id===a.questionId);if(q)byNode[q.nodeId].push(a)});root.innerHTML='<section class="glass screen"><div class="stage-head"><div><div class="eyebrow">LEARNING REPORT</div><h2 style="font-size:35px;margin:5px 0">學習診斷報告</h2><p class="small">本報告根據作答正確率與錯題知識節點產生。</p></div><div class="toolbar"><button class="btn" id="downloadCsv">下載 CSV</button><button class="btn primary" id="againBtn">重新開始</button></div></div><div class="stats" style="margin:24px 0"><div class="stat"><div class="value">'+correct+'/'+Math.max(total,QUESTIONS.length)+'</div><div class="caption">作答正確</div></div><div class="stat"><div class="value">'+(total?Math.round(correct/total*100):0)+'%</div><div class="caption">個人正確率</div></div><div class="stat"><div class="value">'+Object.values(state.scores).reduce((a,b)=>a+b.score,0)+'</div><div class="caption">總分</div></div></div><div class="report">'+Object.entries(byNode).map(([id,arr])=>{const rate=arr.length?Math.round(arr.filter(a=>a.correct).length/arr.length*100):0;return '<div class="mastery-item"><div class="mastery-line"><span>'+esc(nodeText(id))+'</span><span style="color:'+(rate>=70?'var(--green)':'var(--gold)')+'">'+rate+'%</span></div><div class="progress" style="margin-top:12px"><span style="width:'+rate+'%;background:'+(rate>=70?'linear-gradient(90deg,#34d399,#4ade80)':'linear-gradient(90deg,#fbbf24,#fb7185)')+'"></span></div><p class="small" style="margin:10px 0 0">'+(rate>=70?'已具備基本精熟，可挑戰情境題。':'建議重練此知識點，特別注意常見迷思。')+'</p></div>'}).join('')+'</div><div class="glass side-card" style="margin-top:16px;background:rgba(255,255,255,.035)"><div class="eyebrow">REVIEW QUEUE</div><h3 style="margin:5px 0 12px">待複習題目</h3>'+(attempts.filter(a=>!a.correct).map(a=>{const q=QUESTIONS.find(x=>x.id===a.questionId);return '<div class="rank-row"><span class="rank-no">↻</span><span class="rank-name">'+esc(state.lang==='zh'?(q?.cn||a.questionId):(q?.en||a.questionId))+'</span><span class="small">'+esc(levelText(q?.level||''))+'</span></div>'}).join('')||'<div class="empty">目前沒有錯題，太棒了！</div>')+'</div></section>';document.getElementById('againBtn').onclick=()=>{state.qIndex=0;state.phase=state.role==='student'?'question':'lobby';state.attempts=[];state.scores={};state.playerAnswer=undefined;render();if(state.role==='student')startTimer()};document.getElementById('downloadCsv').onclick=downloadCsv}
  function downloadCsv(){const rows=[['question_id','node_id','correct','answer','time_seconds'],...state.attempts.map(a=>{const q=QUESTIONS.find(x=>x.id===a.questionId);return [a.questionId,q?.nodeId||'',a.correct?'yes':'no',LETTERS[a.answer]||'',a.time]})];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='trade-balance-learning-report.csv';a.click();URL.revokeObjectURL(a.href)}
  function modal(html){modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal glass">'+html+'</div></div>'}function closeModal(){modalRoot.innerHTML=''}
  window.toggleLanguage=async()=>{state.lang=state.lang==='zh'?'en':'zh';render();if(state.screen==='host'&&!state.offline&&state.session?.code){try{await api('/api/session/'+state.session.code+'/language',{method:'POST',body:JSON.stringify({language:state.lang})});}catch(_){toast('語言同步失敗：請確認 Worker 連線')}}};window.toggleMute=async()=>{await unlockAudio();state.muted=!state.muted;render();if(!state.muted){beep('click');toast(state.lang==='zh'?'音效已開啟':'Sound on')}};
  render();
})();
</script>
</body>
